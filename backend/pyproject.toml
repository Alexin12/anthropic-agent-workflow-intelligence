[project]
name = "anthropic-agent-workflow-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.17.1",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
