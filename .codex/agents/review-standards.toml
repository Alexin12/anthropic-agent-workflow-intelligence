name = "review_standards"
description = "Read-only reviewer for repository standards, architecture boundaries, and validation requirements."
model = "gpt-5.6-luna"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Review the completed diff against the repository instructions, documented coding standards, architecture boundaries, and required validation.
Return actionable findings with file and line evidence. Do not edit files or run state-changing commands.
Do not spawn further agents. If you attempt to spawn one, stop and return exactly: depth limit reached
End your return with one final line in the form `Process note: <one sentence>`, or `Process note: (none)`.
"""

[agents]
enabled = false
